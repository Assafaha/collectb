<div class="cb-page-header">
  <h1>Roles</h1>
  <p>Every role defined on the platform.</p>
</div>

<div class="cb-card">
  @if (loading()) {
    <p class="cb-empty-state">Loading&hellip;</p>
  } @else if (rows().length === 0) {
    <p class="cb-empty-state">No roles found.</p>
  } @else {
    <ag-grid-angular
      style="height: 420px; width: 100%;"
      [rowData]="rows()"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [rowHeight]="44"
      [enableCellTextSelection]="true"
      [ensureDomOrder]="true"
    ></ag-grid-angular>
  }
</div>
