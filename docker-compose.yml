services:
  postgres:
    image: postgres:16-alpine
    container_name: collectb
    restart: unless-stopped
    environment:
      POSTGRES_USER: collectdb
      POSTGRES_PASSWORD: abc123
      POSTGRES_DB: collectdb
    ports:
      - "5432:5432"
    volumes:
      - collectb-postgres-data:/var/lib/postgresql/data

volumes:
  collectb-postgres-data:
