spring.application.name=collectb
spring.profiles.default=development

spring.datasource.url=jdbc:postgresql://localhost:5432/collectdb
spring.datasource.username=collectdb
spring.datasource.password=abc123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Liquibase (not Hibernate) owns the schema; ddl-auto must stay "none" so JPA never tries to
# auto-generate/alter tables. open-in-view is disabled since there is no view/template layer yet
# and leaving it on would mask lazy-loading issues once associations are introduced.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Spring Authorization Server issuer - must exactly match the base URL clients use to reach this
# app (including port), since it is embedded verbatim in OIDC discovery metadata and JWT "iss".
collectb.oauth2.issuer-uri=http://localhost:8080

# Cookie-only session tracking: without this, Tomcat appends a ";jsessionid=..." matrix param to
# the very first redirect of a session (e.g. the /oauth2/authorize -> /login redirect, before any
# cookie has been set on the client yet). Spring Security's StrictHttpFirewall rejects any URL
# containing a raw ";" as a potential attack, which was throwing a RequestRejectedException on
# that very first hop of the login flow, corrupting the OAuth2 authorization-code flow (the saved
# request ended up pointing at the resulting /error page instead of /oauth2/authorize).
server.servlet.session.tracking-modes=cookie
