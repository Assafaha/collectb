<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in · Collectb</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--cb-bg: #10131f;
			--cb-surface: #1b2136;
			--cb-border-soft: #232b46;
			--cb-border: #2a3350;
			--cb-text: #e6e9f2;
			--cb-text-muted: #94a3b8;
			--cb-accent: #6366f1;
			--cb-accent-hover: #7c7ff2;
			--cb-danger: #ef4444;
			--cb-danger-soft: #ef44441f;
			--cb-success: #22c55e;
			--cb-success-soft: #22c55e1f;
			--cb-radius: 10px;
			--cb-radius-sm: 6px;
			--cb-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
			background:
				radial-gradient(circle at 20% 20%, #1c2340 0%, transparent 45%),
				radial-gradient(circle at 80% 80%, #1a2038 0%, transparent 45%),
				var(--cb-bg);
			color: var(--cb-text);
		}

		.card {
			width: 100%;
			max-width: 380px;
			margin: 24px;
			padding: 36px 32px;
			background: var(--cb-surface);
			border: 1px solid var(--cb-border-soft);
			border-radius: var(--cb-radius);
			box-shadow: var(--cb-shadow);
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 28px;
		}

		.brand-mark {
			width: 34px;
			height: 34px;
			border-radius: 8px;
			background: var(--cb-accent);
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 700;
			color: #fff;
			font-size: 15px;
		}

		.brand-name {
			font-weight: 600;
			font-size: 17px;
			letter-spacing: 0.2px;
		}

		h1 {
			font-size: 20px;
			font-weight: 600;
			margin: 0 0 4px;
		}

		.subtitle {
			color: var(--cb-text-muted);
			font-size: 13.5px;
			margin: 0 0 22px;
		}

		.alert {
			border-radius: var(--cb-radius-sm);
			padding: 10px 12px;
			font-size: 13.5px;
			margin-bottom: 18px;
		}

		.alert-error {
			background: var(--cb-danger-soft);
			color: #fca5a5;
			border: 1px solid #ef444440;
		}

		.alert-info {
			background: var(--cb-success-soft);
			color: #86efac;
			border: 1px solid #22c55e40;
		}

		label {
			display: block;
			font-size: 12.5px;
			font-weight: 500;
			color: var(--cb-text-muted);
			margin-bottom: 6px;
		}

		.field {
			margin-bottom: 16px;
		}

		input[type="text"],
		input[type="password"] {
			width: 100%;
			padding: 10px 12px;
			border-radius: var(--cb-radius-sm);
			border: 1px solid var(--cb-border);
			background: #10131f;
			color: var(--cb-text);
			font-size: 14px;
			font-family: inherit;
			outline: none;
			transition: border-color 0.15s ease;
		}

		input[type="text"]:focus,
		input[type="password"]:focus {
			border-color: var(--cb-accent);
		}

		button {
			width: 100%;
			margin-top: 6px;
			padding: 10px 12px;
			border: none;
			border-radius: var(--cb-radius-sm);
			background: var(--cb-accent);
			color: #fff;
			font-size: 14px;
			font-weight: 600;
			font-family: inherit;
			cursor: pointer;
			transition: background 0.15s ease;
		}

		button:hover {
			background: var(--cb-accent-hover);
		}

		.footer {
			margin-top: 22px;
			text-align: center;
			font-size: 12.5px;
			color: var(--cb-text-muted);
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="brand">
			<div class="brand-mark">C</div>
			<div class="brand-name">Collectb</div>
		</div>

		<h1>Sign in</h1>
		<p class="subtitle">Use your Collectb account to continue.</p>

		<div class="alert alert-error" th:if="${param.error}">
			Invalid username or password. Please try again.
		</div>
		<div class="alert alert-info" th:if="${param.logout}">
			You have been logged out.
		</div>

		<form method="post" th:action="@{/login}">
			<div class="field">
				<label for="username">Email</label>
				<input type="text" id="username" name="username" autocomplete="username" autofocus>
			</div>
			<div class="field">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" autocomplete="current-password">
			</div>
			<button type="submit">Sign in</button>
		</form>

		<div class="footer">Collectb Admin Portal</div>
	</div>
</body>
</html>
